name: Emacs 32exp

on:
  push:
    branches:
      - master
    paths:
      - "Formula/emacs-mac@32exp.rb"
      - "patches/**"
      - "Library/**"
      - ".github/workflows/emacs32exp.yaml"
  pull_request:
    paths:
      - "Formula/emacs-mac@32exp.rb"
      - "patches/**"
      - "Library/**"
      - ".github/workflows/emacs32exp.yaml"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
        build_opts:
          - ""
          - "--with-native-compilation"
    env:
      HOMEBREW_EMACS_MAC_MODE: local
      # The tap below is a symlink to the checkout, whose origin is the
      # real repo. Let brew auto-update fetch it and the PR under test
      # would be replaced by master.
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4

      # A HEAD-only formula gets re-loaded by name in the post_install
      # child process. Without a tap the only copy left is the one in
      # the keg, where the requires at the top of the formula cannot
      # resolve. Make the checkout the tap so it loads from there.
      - name: Link checkout as tap
        run: |
          TAP_DIR="$(brew --repository)/Library/Taps/railwaycat/homebrew-emacsmacport"
          mkdir -p "$(dirname "$TAP_DIR")"
          ln -s "$GITHUB_WORKSPACE" "$TAP_DIR"
          brew tap

      - name: Trust the tap
        run: brew trust railwaycat/emacsmacport

      - name: Build Emacs
        run: |
          export HOMEBREW_DEVELOPER=1
          brew install --HEAD railwaycat/emacsmacport/emacs-mac@32exp ${{ matrix.build_opts }} --verbose

      - name: Test Building
        run: $(brew --prefix)/bin/emacs --batch --eval='(print (+ 2 2))'

      - name: Pack up build logs
        if: ${{ always() }}
        run: |
          BUILD_OPTS=$(echo "${{ matrix.build_opts }}" | sed 's/ //')
          echo "build_opts=$BUILD_OPTS" >> "$GITHUB_ENV"
          RUNNER_OS=$(echo "${{ matrix.os }}" | sed 's/ //')
          echo "runner_os=$RUNNER_OS" >> "$GITHUB_ENV"
          tar -C ~/Library/Logs/Homebrew/emacs-mac@32exp/ -czvf ~/Library/Logs/Homebrew/emacs-mac@32exp-$RUNNER_OS$BUILD_OPTS.tar.gz .

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: emacs-mac@32exp-${{ env.runner_os }}${{ env.build_opts }}.tar.gz
          path: |
            ~/Library/Logs/Homebrew/emacs-mac@32exp-${{ env.runner_os }}${{ env.build_opts }}.tar.gz
